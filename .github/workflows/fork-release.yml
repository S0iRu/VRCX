# Fork only (S0iRu/VRCX): every push to master builds the "VRCX Custom" Windows
# installer and publishes it as a GitHub release. Installed copies pick it up via
# the in-app updater (Fork branch, see src/shared/constants/fork.js).
#
# Skip a release by putting "[skip release]" in the head commit message.
name: Fork release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'S0iRu/VRCX' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Dotnet/VRCX-Cef.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore npm dependencies
        run: npm ci

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build-scripts/release-fork.ps1 -Publish -NoPush
